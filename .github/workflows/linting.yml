name: Linting

on:
    pull_request:
        types: [opened, synchronize, reopened]

# Least privilege at the workflow level; jobs that need write scopes grant
# them individually below.
permissions:
    contents: read

jobs:
    lint:
        runs-on: ubuntu-latest
        permissions:
            checks: write
            pull-requests: write
        steps:
            - name: Check out code
              uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: Enable corepack
              run: corepack enable

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc
                  cache: yarn

            - name: Install dependencies
              run: yarn install --immutable

            # Lint with the project's flat config (eslint.config.js) and surface
            # findings as inline PR review comments via reviewdog.
            - name: Run eslint via reviewdog
              uses: reviewdog/action-eslint@v1
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  reporter: github-pr-review
                  fail_level: error
                  eslint_flags: "."

    build:
        runs-on: ubuntu-latest
        steps:
            - name: Check out code
              uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: Enable corepack
              run: corepack enable

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc
                  cache: yarn

            - name: Install dependencies
              run: yarn install --immutable

            # dist/ is never committed (built and attached at release time
            # instead — see release.yml) — this just proves the bundle still
            # compiles so a release can't break on an unexercised build. Only
            # present once the repo has been renamed into a real action; the
            # template repository itself has nothing to bundle.
            - name: Build
              if: hashFiles('action.yml') != ''
              run: yarn build
