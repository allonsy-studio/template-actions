name: Release

on:
    push:
        branches: [main]

permissions:
    contents: write # push tags + create the GitHub release
    pull-requests: write # changesets opens the "Version Packages" PR
    id-token: write # OIDC token for npm trusted publishing

jobs:
    release:
        runs-on: ubuntu-latest
        env:
            # Releases are changeset-driven, not commit-driven — skip the local
            # git hooks when the changesets action commits the version bump.
            HUSKY: 0

        steps:
            - name: Create GitHub App token
              id: app-token
              uses: actions/create-github-app-token@v3
              with:
                  client-id: ${{ secrets.APP_CLIENT_ID }}
                  private-key: ${{ secrets.APP_PRIVATE_KEY }}
                  permission-contents: write
                  permission-pull-requests: write

            - name: Check out code
              uses: actions/checkout@v7
              with:
                  # Full history + tags to detect prior releases, and persist the
                  # app token so the publish step can push tags without re-auth.
                  fetch-depth: 0
                  token: ${{ steps.app-token.outputs.token }}

            - name: Enable corepack
              run: corepack enable

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: yarn

            - name: Install dependencies
              run: yarn install --immutable

            # OIDC trusted publishing needs npm >= 11.5.1 (newer than Node 24
            # ships), and `yarn npm publish` doesn't do the OIDC token exchange.
            - name: Update npm for OIDC trusted publishing
              run: npm install --global npm@latest

            - name: Configure git identity for release tags
              run: |
                git config user.name 'allons-y-studio-bot[bot]'
                git config user.email '353516968+allons-y-studio-bot[bot]@users.noreply.github.com'

            - name: Create release PR or publish to npm
              uses: changesets/action@v1
              with:
                version: yarn run version
                publish: yarn release
                title: "chore(release): version packages"
                commit: "chore(release): version packages"
                commitMode: github-api
                createGithubReleases: false
              env:
                GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
